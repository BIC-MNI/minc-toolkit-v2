name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.9.18)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Bash is required for `set -o pipefail` and other bashisms used in run steps.
# In Linux container jobs the default /bin/sh is dash, which doesn't support
# pipefail. Setting this here applies to all run: steps in the workflow.
defaults:
  run:
    shell: bash

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      major: ${{ steps.v.outputs.major }}
      minor: ${{ steps.v.outputs.minor }}
      patch: ${{ steps.v.outputs.patch }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          IFS=. read -r MAJOR MINOR PATCH <<<"$VERSION"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"

  source-tarball:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Configure + package source
        run: |
          cmake -B build \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MAJOR=${{ needs.meta.outputs.major }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MINOR=${{ needs.meta.outputs.minor }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_PATCH=${{ needs.meta.outputs.patch }} \
            -DCPACK_PACKAGE_VERSION=${{ needs.meta.outputs.version }} \
            -DMT_USE_BLAS=OFF \
            .
          cd build && cpack --config CPackSourceConfig.cmake -G TGZ
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: build/*-src.tar.gz

  deb:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu, codename: jammy,    image: 'ubuntu:22.04', variant: minimal }
          - { distro: ubuntu, codename: jammy,    image: 'ubuntu:22.04', variant: full }
          - { distro: ubuntu, codename: noble,    image: 'ubuntu:24.04', variant: minimal }
          - { distro: ubuntu, codename: noble,    image: 'ubuntu:24.04', variant: full }
          - { distro: ubuntu, codename: resolute, image: 'ubuntu:26.04', variant: minimal }
          - { distro: ubuntu, codename: resolute, image: 'ubuntu:26.04', variant: full }
          - { distro: debian, codename: bullseye, image: 'debian:11',    variant: minimal }
          - { distro: debian, codename: bullseye, image: 'debian:11',    variant: full }
          - { distro: debian, codename: bookworm, image: 'debian:12',    variant: minimal }
          - { distro: debian, codename: bookworm, image: 'debian:12',    variant: full }
          - { distro: debian, codename: trixie,   image: 'debian:13',    variant: minimal }
          - { distro: debian, codename: trixie,   image: 'debian:13',    variant: full }
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Install build deps
        run: |
          apt-get update
          # bc is used by the mni_autoreg / patch_morphology test scripts.
          apt-get install -y \
            build-essential cmake git ccache lsb-release file bc \
            bison flex perl gfortran imagemagick \
            zlib1g-dev libnetcdf-dev libhdf5-dev \
            libgsl-dev libfftw3-dev libjpeg-dev libopenjp2-7-dev \
            libarchive-dev libexpat1-dev libopenblas-dev
          if [ "${{ matrix.variant }}" = "full" ]; then
            apt-get install -y libx11-dev libxi-dev libxmu-dev \
              libgl-dev libglu1-mesa-dev libglfw3-dev libx11-dev libxrandr-dev libxext-dev
          fi
      - name: Allow git to read the workspace owned by the runner user
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-${{ matrix.image }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.image }}-${{ matrix.variant }}-
      - name: Configure + build
        run: |
          set -euxo pipefail
          if [ "${{ matrix.variant }}" = "full" ]; then FULL=ON; else FULL=OFF; fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/minc/${{ needs.meta.outputs.version }} \
            -DCPACK_PACKAGE_VERSION=${{ needs.meta.outputs.version }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MAJOR=${{ needs.meta.outputs.major }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MINOR=${{ needs.meta.outputs.minor }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_PATCH=${{ needs.meta.outputs.patch }} \
            -DMT_BUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DMT_BUILD_ITK_TOOLS=ON \
            -DMT_BUILD_ANTS=$FULL \
            -DMT_BUILD_C3D=$FULL \
            -DMT_BUILD_ELASTIX=$FULL \
            -DMT_BUILD_VISUAL_TOOLS=$FULL \
            -DMT_BUILD_OPENBLAS=OFF \
            -DMT_USE_OPENMP=ON \
            -DUSE_SYSTEM_ZLIB=ON \
            -DUSE_SYSTEM_NETCDF=ON \
            -DUSE_SYSTEM_HDF5=ON \
            -DUSE_SYSTEM_GSL=ON \
            -DUSE_SYSTEM_FFTW3F=ON \
            -DUSE_SYSTEM_FFTW3D=ON \
            -DUSE_SYSTEM_JPEG=ON \
            -DUSE_SYSTEM_OPENJPEG=ON \
            -DUSE_SYSTEM_LIBARCHIVE=ON \
            -DUSE_SYSTEM_ITK=OFF \
            .
          cmake --build build -j"$(nproc)"
          df -h && du -sh build/ || true
      - name: Run test suite
        run: |
          set -euxo pipefail
          cd build
          ctest --output-on-failure -j"$(nproc)"
      - name: Package
        run: |
          set -euxo pipefail
          cd build
          cpack -G DEB
      - name: Rename artifact
        run: |
          mv build/*.deb \
            "minc-toolkit-v2_${{ needs.meta.outputs.version }}_${{ matrix.distro }}-${{ matrix.codename }}-${{ matrix.variant }}_amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.codename }}-${{ matrix.variant }}
          path: '*.deb'

  rpm:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: 42, image: 'fedora:42', variant: minimal }
          - { release: 42, image: 'fedora:42', variant: full }
          - { release: 43, image: 'fedora:43', variant: minimal }
          - { release: 43, image: 'fedora:43', variant: full }
          - { release: 44, image: 'fedora:44', variant: minimal }
          - { release: 44, image: 'fedora:44', variant: full }
    container: ${{ matrix.image }}
    env:
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 2G
      # Fedora's rpmbuild check-rpaths rejects RPATHs that point into the
      # install dir itself (e.g. /opt/minc/X/lib in a binary in /opt/minc/X/lib).
      # The toolkit needs that RPATH to find its own libraries at runtime, so
      # silence the check rather than scrub the rpaths.
      QA_RPATHS: 0x000f
    steps:
      - name: Install build deps
        run: |
          # 'which' is not installed on Fedora 42+ (package dropped); the minctools
          # Perl tests locate binaries via `which`, and bc is used by the
          # mni_autoreg / patch_morphology test scripts.
          dnf install -y \
            gcc gcc-c++ gcc-gfortran cmake make git ccache rpm-build file which bc \
            bison flex perl perl-FindBin perl-File-Path ImageMagick \
            zlib-devel netcdf-devel hdf5-devel gsl-devel \
            fftw-devel libjpeg-turbo-devel openjpeg2-devel \
            libarchive-devel expat-devel openblas-devel
          if [ "${{ matrix.variant }}" = "full" ]; then
            dnf install -y libX11-devel libXi-devel libXmu-devel \
              mesa-libGL-devel mesa-libGLU-devel glfw-devel libX11-devel libXrandr-devel libXext-devel
          fi
      - name: Allow git to read the workspace owned by the runner user
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-${{ matrix.image }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.image }}-${{ matrix.variant }}-
      - name: Configure + build
        run: |
          set -euxo pipefail
          if [ "${{ matrix.variant }}" = "full" ]; then FULL=ON; else FULL=OFF; fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/minc/${{ needs.meta.outputs.version }} \
            -DCPACK_PACKAGE_VERSION=${{ needs.meta.outputs.version }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MAJOR=${{ needs.meta.outputs.major }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MINOR=${{ needs.meta.outputs.minor }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_PATCH=${{ needs.meta.outputs.patch }} \
            -DMT_BUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DMT_BUILD_ITK_TOOLS=ON \
            -DMT_BUILD_ANTS=$FULL \
            -DMT_BUILD_C3D=$FULL \
            -DMT_BUILD_ELASTIX=$FULL \
            -DMT_BUILD_VISUAL_TOOLS=$FULL \
            -DMT_BUILD_OPENBLAS=OFF \
            -DMT_USE_OPENMP=ON \
            -DUSE_SYSTEM_ZLIB=ON \
            -DUSE_SYSTEM_NETCDF=ON \
            -DUSE_SYSTEM_HDF5=ON \
            -DUSE_SYSTEM_GSL=ON \
            -DUSE_SYSTEM_FFTW3F=ON \
            -DUSE_SYSTEM_FFTW3D=ON \
            -DUSE_SYSTEM_JPEG=ON \
            -DUSE_SYSTEM_OPENJPEG=ON \
            -DUSE_SYSTEM_LIBARCHIVE=ON \
            -DUSE_SYSTEM_ITK=OFF \
            .
          cmake --build build -j"$(nproc)"
          df -h && du -sh build/ || true
      - name: Run test suite
        run: |
          set -euxo pipefail
          cd build
          ctest --output-on-failure -j"$(nproc)"
      - name: Package
        run: |
          set -euxo pipefail
          cd build
          cpack -G RPM
      - name: Rename artifact
        run: |
          mv build/*.rpm \
            "minc-toolkit-v2-${{ needs.meta.outputs.version }}-fc${{ matrix.release }}-${{ matrix.variant }}.x86_64.rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-fc${{ matrix.release }}-${{ matrix.variant }}
          path: '*.rpm'

  macos:
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
        variant: [minimal, full]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install build deps
        run: brew install cmake ccache bison flex pkg-config libpng glfw
      - name: Configure + build
        run: |
          set -euxo pipefail
          if [ "${{ matrix.variant }}" = "full" ]; then FULL=ON; else FULL=OFF; fi
          cmake -B build \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_INSTALL_PREFIX=/opt/minc/${{ needs.meta.outputs.version }} \
            -DCMAKE_BUILD_RPATH="$PWD/build/external/opt/minc/${{ needs.meta.outputs.version }}/lib" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCPACK_PACKAGE_VERSION=${{ needs.meta.outputs.version }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MAJOR=${{ needs.meta.outputs.major }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MINOR=${{ needs.meta.outputs.minor }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_PATCH=${{ needs.meta.outputs.patch }} \
            -DMT_BUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DMT_BUILD_VISUAL_TOOLS=$FULL \
            -DMT_BUILD_ITK_TOOLS=ON \
            -DMT_BUILD_ANTS=$FULL \
            -DMT_BUILD_C3D=$FULL \
            -DMT_BUILD_ELASTIX=$FULL \
            -DMT_BUILD_OPENBLAS=OFF \
            -DMT_USE_OPENMP=OFF \
            -DUSE_SYSTEM_ITK=OFF \
            .
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          df -h && du -sh build/ || true
      - name: Run test suite
        run: |
          set -euxo pipefail
          cd build
          ctest --output-on-failure -j"$(sysctl -n hw.ncpu)"
      - name: Package
        run: |
          set -euxo pipefail
          cd build
          cpack -G productbuild
      - name: Rename artifact
        run: |
          mv build/*.pkg \
            "minc-toolkit-v2-${{ needs.meta.outputs.version }}-${{ matrix.runner }}-arm64-${{ matrix.variant }}.pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runner }}-${{ matrix.variant }}
          path: '*.pkg'

  # Fully vendored superbuild -> one relocatable tarball per variant, for people
  # who are not on a distro this workflow packages for, or who cannot install to
  # a system prefix. Passing no USE_SYSTEM_* flags leaves them at their OFF
  # default, so zlib, HDF5, netCDF, GSL, FFTW, JPEG, OpenJPEG, libarchive,
  # OpenBLAS and ITK are all built from source and shipped inside the tarball.
  superbuild-tarball:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, full]
    # 22.04, not 24.04: this artifact has to run somewhere other than the machine
    # that built it, so build against the oldest glibc (2.35) whose CMake (3.22)
    # still satisfies every vendored dependency (HDF5 asks the most: >= 3.18).
    container: 'ubuntu:22.04'
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Install build deps
        run: |
          apt-get update
          # Deliberately no -dev package for anything the superbuild vendors, so
          # nothing quietly falls back to a system copy and escapes the tarball.
          # bc is used by the mni_autoreg / patch_morphology test scripts.
          apt-get install -y \
            build-essential cmake git ccache lsb-release file bc \
            bison flex perl gfortran imagemagick
          # The visual tools have no vendored windowing stack -- bicgl links the
          # system GLFW, exactly as the .deb does.
          if [ "${{ matrix.variant }}" = "full" ]; then
            apt-get install -y libx11-dev libxi-dev libxmu-dev \
              libgl-dev libglu1-mesa-dev libglfw3-dev libxrandr-dev libxext-dev
          fi
      - name: Allow git to read the workspace owned by the runner user
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-superbuild-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-superbuild-${{ matrix.variant }}-
      - name: Configure + build
        run: |
          set -euxo pipefail
          if [ "${{ matrix.variant }}" = "full" ]; then FULL=ON; else FULL=OFF; fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/minc/${{ needs.meta.outputs.version }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MAJOR=${{ needs.meta.outputs.major }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_MINOR=${{ needs.meta.outputs.minor }} \
            -DMINC_TOOLKIT_PACKAGE_VERSION_PATCH=${{ needs.meta.outputs.patch }} \
            -DMT_BUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DMT_BUILD_ITK_TOOLS=ON \
            -DMT_BUILD_ANTS=$FULL \
            -DMT_BUILD_C3D=$FULL \
            -DMT_BUILD_ELASTIX=$FULL \
            -DMT_BUILD_VISUAL_TOOLS=$FULL \
            -DMT_BUILD_OPENBLAS=ON \
            -DMT_USE_OPENMP=ON \
            -DUSE_SYSTEM_ITK=OFF \
            .
          cmake --build build -j"$(nproc)"
          df -h && du -sh build/ || true
      - name: Run test suite
        run: |
          set -euxo pipefail
          cd build
          ctest --output-on-failure -j"$(nproc)"
      - name: Build tarball
        run: |
          set -euxo pipefail
          VER="${{ needs.meta.outputs.version }}"
          DESTDIR="$PWD/pkgroot" cmake --build build --target install
          # Repoint the top directory at a self-describing name: the tree unpacks
          # anywhere, so the /opt/minc/<ver> prefix it was configured with is only
          # a build-time detail.
          mv "pkgroot/opt/minc/$VER" "pkgroot/minc-toolkit-$VER"
          tar czf "minc-toolkit-v2-$VER-${{ matrix.variant }}-linux-x86_64.tar.gz" \
            -C pkgroot "minc-toolkit-$VER"
          ls -lh ./*.tar.gz
      - name: Check the tarball actually relocates
        run: |
          set -euxo pipefail
          # Unpack somewhere the build never mentioned. Sourcing the config script
          # and writing a volume covers the whole chain the run paths have to carry:
          # libminc -> HDF5 -> zlib (MINC_COMPRESS=4 puts the write through deflate).
          mkdir -p /tmp/relocated
          tar xzf ./*.tar.gz -C /tmp/relocated
          . /tmp/relocated/minc-toolkit-*/minc-toolkit-config.sh
          # Same geometry as the mni_autoreg ellipse0 test; the defaults do not
          # overlap a small volume.
          make_phantom -clobber -ellipse -nelements 64 64 64 -step 2 2 2 -start -64 -64 -64 -center 0 0 0 /tmp/relocated/phantom.mnc
          mincinfo /tmp/relocated/phantom.mnc
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.variant }}
          path: '*.tar.gz'

  release:
    if: github.event_name == 'push'
    needs: [meta, source-tarball, deb, rpm, macos, superbuild-tarball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          body: |
            ## Installation

            **Linux**:
            - Ubuntu 22.04 / 24.04 / 26.04 / Debian 11 / 12 / 13: `sudo dpkg -i minc-toolkit-v2_<version>_<distro>-<codename>-<variant>_amd64.deb && sudo apt-get install -fy`
            - Fedora 42 / 43 / 44: `sudo dnf install minc-toolkit-v2-<version>-fc<release>-<variant>.x86_64.rpm`

            **Linux, any distro** (`minc-toolkit-v2-<version>-<variant>-linux-x86_64.tar.gz`):
            - Self-contained and relocatable — unpack it anywhere, no root needed:
              `tar xzf minc-toolkit-v2-<version>-<variant>-linux-x86_64.tar.gz -C ~/opt`
              then `source ~/opt/minc-toolkit-<version>/minc-toolkit-config.sh`.
            - Every dependency the toolkit vendors (zlib, HDF5, netCDF, GSL, FFTW, JPEG, OpenJPEG, libarchive, OpenBLAS, ITK) is inside the tarball. Only glibc 2.35+ and, for the `full` variant, the system X11/OpenGL/GLFW runtime libraries are needed.
            - Source the config script from **bash**: it locates the prefix through `BASH_SOURCE`, and other shells fall back to the path baked in at build time.

            **macOS** (Apple Silicon / arm64; built on macos-14 / 15 / 26 runners):
            - Open the matching `.pkg` for your macOS version. **First run is unsigned**: right-click → Open to bypass Gatekeeper.

            **Variants**:
            - `minimal` — core MINC toolkit only (no ANTS, C3D, Elastix, or the X11/OpenGL visual tools).
            - `full` — everything: ANTS, C3D, Elastix, plus the visual tools (Display, Register, ray_trace) and their X11/OpenGL runtime deps.

            **Source**:
            - `minc-toolkit-v2-<version>-src.tar.gz` — full source with submodules.
