name: ci

# Build + run the ctest suite on every push and pull request. This is the
# per-commit signal; the tag-triggered release.yml handles packaging. No
# packaging/upload here -- just configure, build, and test.
on:
  push:
    branches: ['**']   # all branches; tag pushes are handled by release.yml
  pull_request:

permissions:
  contents: read

# A newer push to the same ref cancels an in-progress run (ITK-from-source
# builds are expensive; don't waste runners on superseded commits).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, full]
    container: 'ubuntu:24.04'
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Install build deps
        run: |
          apt-get update
          # bc is used by the mni_autoreg / patch_morphology test scripts.
          apt-get install -y \
            build-essential cmake git ccache lsb-release file bc \
            bison flex perl gfortran imagemagick \
            zlib1g-dev libnetcdf-dev libhdf5-dev \
            libgsl-dev libfftw3-dev libjpeg-dev libopenjp2-7-dev \
            libarchive-dev libexpat1-dev libopenblas-dev
          if [ "${{ matrix.variant }}" = "full" ]; then
            apt-get install -y libx11-dev libxi-dev libxmu-dev \
              libgl-dev libglu1-mesa-dev libglfw3-dev libx11-dev libxrandr-dev libxext-dev
          fi
      - name: Allow git to read the workspace owned by the runner user
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-ci-ubuntu2404-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-ci-ubuntu2404-${{ matrix.variant }}-
      - name: Configure + build
        run: |
          set -euxo pipefail
          if [ "${{ matrix.variant }}" = "full" ]; then FULL=ON; else FULL=OFF; fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/minc/ci \
            -DMT_BUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DMT_BUILD_ITK_TOOLS=ON \
            -DMT_BUILD_ANTS=$FULL \
            -DMT_BUILD_C3D=$FULL \
            -DMT_BUILD_ELASTIX=$FULL \
            -DMT_BUILD_VISUAL_TOOLS=$FULL \
            -DMT_BUILD_OPENBLAS=OFF \
            -DMT_USE_OPENMP=ON \
            -DUSE_SYSTEM_ZLIB=ON \
            -DUSE_SYSTEM_NETCDF=ON \
            -DUSE_SYSTEM_HDF5=ON \
            -DUSE_SYSTEM_GSL=ON \
            -DUSE_SYSTEM_FFTW3F=ON \
            -DUSE_SYSTEM_FFTW3D=ON \
            -DUSE_SYSTEM_JPEG=ON \
            -DUSE_SYSTEM_OPENJPEG=ON \
            -DUSE_SYSTEM_LIBARCHIVE=ON \
            -DUSE_SYSTEM_ITK=OFF \
            .
          cmake --build build -j"$(nproc)"
          df -h && du -sh build/ || true
      - name: Run test suite
        run: |
          set -euxo pipefail
          cd build
          ctest --output-on-failure -j"$(nproc)"

  fedora:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, full]
    container: 'fedora:44'
    env:
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 2G
      QA_RPATHS: 0x000f
    steps:
      - name: Install build deps
        run: |
          # 'which' is not installed on Fedora 42+ (package dropped); the minctools
          # Perl tests locate binaries via `which`, and bc is used by the
          # mni_autoreg / patch_morphology test scripts.
          dnf install -y \
            gcc gcc-c++ gcc-gfortran cmake make git ccache file which bc \
            bison flex perl perl-FindBin perl-File-Path ImageMagick \
            zlib-devel netcdf-devel hdf5-devel gsl-devel \
            fftw-devel libjpeg-turbo-devel openjpeg2-devel \
            libarchive-devel expat-devel openblas-devel
          if [ "${{ matrix.variant }}" = "full" ]; then
            dnf install -y libX11-devel libXi-devel libXmu-devel \
              mesa-libGL-devel mesa-libGLU-devel glfw-devel libX11-devel libXrandr-devel libXext-devel
          fi
      - name: Allow git to read the workspace owned by the runner user
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-ci-fedora44-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-ci-fedora44-${{ matrix.variant }}-
      - name: Configure + build
        run: |
          set -euxo pipefail
          if [ "${{ matrix.variant }}" = "full" ]; then FULL=ON; else FULL=OFF; fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/minc/ci \
            -DMT_BUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DMT_BUILD_ITK_TOOLS=ON \
            -DMT_BUILD_ANTS=$FULL \
            -DMT_BUILD_C3D=$FULL \
            -DMT_BUILD_ELASTIX=$FULL \
            -DMT_BUILD_VISUAL_TOOLS=$FULL \
            -DMT_BUILD_OPENBLAS=OFF \
            -DMT_USE_OPENMP=ON \
            -DUSE_SYSTEM_ZLIB=ON \
            -DUSE_SYSTEM_NETCDF=ON \
            -DUSE_SYSTEM_HDF5=ON \
            -DUSE_SYSTEM_GSL=ON \
            -DUSE_SYSTEM_FFTW3F=ON \
            -DUSE_SYSTEM_FFTW3D=ON \
            -DUSE_SYSTEM_JPEG=ON \
            -DUSE_SYSTEM_OPENJPEG=ON \
            -DUSE_SYSTEM_LIBARCHIVE=ON \
            -DUSE_SYSTEM_ITK=OFF \
            .
          cmake --build build -j"$(nproc)"
          df -h && du -sh build/ || true
      - name: Run test suite
        run: |
          set -euxo pipefail
          cd build
          ctest --output-on-failure -j"$(nproc)"

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, full]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install build deps
        run: brew install cmake ccache bison flex pkg-config libpng glfw
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ci-macos-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-ci-macos-${{ matrix.variant }}-
      - name: Configure + build
        run: |
          set -euxo pipefail
          if [ "${{ matrix.variant }}" = "full" ]; then FULL=ON; else FULL=OFF; fi
          cmake -B build \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_INSTALL_PREFIX=/opt/minc/ci \
            -DCMAKE_BUILD_RPATH="$PWD/build/external/opt/minc/ci/lib" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DMT_BUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DMT_BUILD_VISUAL_TOOLS=$FULL \
            -DMT_BUILD_ITK_TOOLS=ON \
            -DMT_BUILD_ANTS=$FULL \
            -DMT_BUILD_C3D=$FULL \
            -DMT_BUILD_ELASTIX=$FULL \
            -DMT_BUILD_OPENBLAS=OFF \
            -DMT_USE_OPENMP=OFF \
            -DUSE_SYSTEM_ITK=OFF \
            .
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          df -h && du -sh build/ || true
      - name: Run test suite
        run: |
          set -euxo pipefail
          cd build
          ctest --output-on-failure -j"$(sysctl -n hw.ncpu)"

  # Everything vendored. Passing no USE_SYSTEM_* flags leaves them all at their
  # OFF default, so the superbuild compiles zlib, HDF5, netCDF, GSL, FFTW, JPEG,
  # OpenJPEG, libarchive, OpenBLAS and ITK from source. Every other Linux job in
  # this file sets nine of those to ON, so without this one the vendored path is
  # never built on Linux at all. It also produces the relocatable tarball that
  # release.yml ships.
  superbuild:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, full]
    # 22.04, not 24.04: the tarball has to run somewhere other than the machine
    # that built it, so build against the oldest glibc (2.35) whose CMake (3.22)
    # still satisfies every vendored dependency (HDF5 asks the most: >= 3.18).
    container: 'ubuntu:22.04'
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Install build deps
        run: |
          apt-get update
          # Deliberately no -dev package for anything the superbuild vendors: the
          # point of this job is that nothing quietly falls back to a system copy.
          # bc is used by the mni_autoreg / patch_morphology test scripts.
          apt-get install -y \
            build-essential cmake git ccache lsb-release file bc \
            bison flex perl gfortran imagemagick
          # The visual tools have no vendored windowing stack -- bicgl links the
          # system GLFW, exactly as the .deb does.
          if [ "${{ matrix.variant }}" = "full" ]; then
            apt-get install -y libx11-dev libxi-dev libxmu-dev \
              libgl-dev libglu1-mesa-dev libglfw3-dev libxrandr-dev libxext-dev
          fi
      - name: Allow git to read the workspace owned by the runner user
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-ci-superbuild-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-ci-superbuild-${{ matrix.variant }}-
      - name: Configure + build
        run: |
          set -euxo pipefail
          if [ "${{ matrix.variant }}" = "full" ]; then FULL=ON; else FULL=OFF; fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/minc/ci \
            -DMT_BUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DMT_BUILD_ITK_TOOLS=ON \
            -DMT_BUILD_ANTS=$FULL \
            -DMT_BUILD_C3D=$FULL \
            -DMT_BUILD_ELASTIX=$FULL \
            -DMT_BUILD_VISUAL_TOOLS=$FULL \
            -DMT_BUILD_OPENBLAS=ON \
            -DMT_USE_OPENMP=ON \
            -DUSE_SYSTEM_ITK=OFF \
            .
          cmake --build build -j"$(nproc)"
          df -h && du -sh build/ || true
      - name: Run test suite
        run: |
          set -euxo pipefail
          cd build
          ctest --output-on-failure -j"$(nproc)"
      - name: Build tarball
        run: |
          set -euxo pipefail
          DESTDIR="$PWD/pkgroot" cmake --build build --target install
          # Strip the ELF objects. CPACK_STRIP_FILES only covers the CPack
          # generators, so this tree would otherwise ship whatever debug info the
          # build produced -- and the toolkit's own components compile with -g.
          # Perl scripts, data and man pages are matched out by file(1).
          find pkgroot -type f -exec file -N {} + 2>/dev/null \
            | awk -F': ' '/ELF .*(executable|shared object)/ { print $1 }' \
            | xargs -r strip --strip-unneeded 2>/dev/null || true
          TOP="minc-toolkit-${GITHUB_SHA:0:7}"
          mv pkgroot/opt/minc/ci "pkgroot/$TOP"
          tar czf "$TOP-${{ matrix.variant }}-linux-x86_64.tar.gz" -C pkgroot "$TOP"
          ls -lh ./*.tar.gz
      - name: Check the tarball actually relocates
        run: |
          set -euxo pipefail
          # Unpack somewhere the build never mentioned. Sourcing the config script
          # and writing a volume covers the whole chain the run paths have to carry:
          # libminc -> HDF5 -> zlib (MINC_COMPRESS=4 puts the write through deflate).
          mkdir -p /tmp/relocated
          tar xzf ./*.tar.gz -C /tmp/relocated
          . /tmp/relocated/minc-toolkit-*/minc-toolkit-config.sh
          # Same geometry as the mni_autoreg ellipse0 test; the defaults do not
          # overlap a small volume.
          make_phantom -clobber -ellipse -nelements 64 64 64 -step 2 2 2 -start -64 -64 -64 -center 0 0 0 /tmp/relocated/phantom.mnc
          mincinfo /tmp/relocated/phantom.mnc
      - uses: actions/upload-artifact@v7
        with:
          name: superbuild-${{ matrix.variant }}
          path: '*.tar.gz'
